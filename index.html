      <meta name="twitter:image" content="https://integraveiculos.com/og-image.jpg">

      <!-- Fontes do Google carregadas em fonts.css — preconnect antecipa a
           conexão TLS/DNS pra elas chegarem um pouco mais rápido -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

      <!-- Dados estruturados — ajuda o Google a montar o card de "concessionária
           perto de mim" com endereço, telefone e horário de funcionamento -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutomotiveBusiness",
        "name": "Integra Veículos",
        "alternateName": "Integra Serviços Ltda.",
        "description": "Concessionária Autorizada Agrale em São Luís, Maranhão. Caminhões, ônibus, tratores e utilitários Marruá.",
        "url": "https://integraveiculos.com/",
        "image": "https://integraveiculos.com/og-image.jpg",
        "telephone": "+559820168515",
        "email": "contato@integraveiculos.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "RD BR 135, KM 6,4, Vila Sarney - Maracanã",
          "addressLocality": "São Luís",
          "addressRegion": "MA",
          "postalCode": "65095-602",
          "addressCountry": "BR"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "18:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "08:00",
            "closes": "12:00"
          }
        ],
        "brand": {
          "@type": "Brand",
          "name": "Agrale"
        }
      }
      </script>

      <style>
        html, body { height: 100%; margin: 0; }
        #root { height: 100%; }
        /* Tela de carregamento exibida enquanto o React ainda não montou —
           sem isso, quem acessa por uma conexão mais lenta pelo celular
           fica olhando pra uma tela branca sem nenhum feedback. O próprio
           React substitui esse conteúdo assim que monta. */
        #root:empty {
          display: flex;
          align-items: center;
          justify-content: center;
          background: #1a1a1a;
        }
        #root:empty::after {
          content: "";
          width: 40px;
          height: 40px;
          border: 3px solid rgba(255,255,255,0.2);
          border-top-color: #C8102E;
          border-radius: 50%;
          animation: integra-spin 0.8s linear infinite;
        }
        @keyframes integra-spin { to { transform: rotate(360deg); } }
      </style>
      
    </head>

    <body>
      <noscript>
        <div style="padding: 48px 24px; text-align: center; font-family: Arial, sans-serif; color: #1a1a1a;">

          <p>
            Para ver o site da Integra, por favor habilite o JavaScript no seu navegador.
            Se preferir, fale com a gente diretamente:
            <a href="tel:+559820168515">(98) 2016-8515</a> ou
            <a href="mailto:contato@integraveiculos.com">contato@integraveiculos.com</a>.
          </p>
        </div>
      </noscript>
      <div id="root"></div>
